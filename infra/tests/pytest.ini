[pytest]
# Mirrors backend/pytest.ini so `pytest -m property` behaves the same in both
# suites. Without registered markers pytest emits PytestUnknownMarkWarning and
# `-m property` silently selects nothing.
#
# --hypothesis-seed is pinned here as well as in CI: an unpinned seed let a
# latent bug in test_properties.py (substring vs exact service-account match)
# surface only intermittently, which read as flakiness rather than a real defect.
addopts = --hypothesis-seed=0
markers =
    unit: Unit tests (no external deps)
    integration: Integration tests
    property: Property-based tests (Hypothesis)
    slow: Slow tests (>5s)

# No --cov here: this suite is static analysis of Terraform/YAML, so line
# coverage of the module under test is not a meaningful signal.
